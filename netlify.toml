# netlify.toml
[build]
  command = "npm run build"
  publish = "public"

[context.production.environment]
  # Node 22. Estaba en 18, que llego a su fin de soporte en abril de 2025 y
  # ademas se quedo por debajo de lo que piden las dependencias: sharp 0.35
  # exige >=20.9 y el build fallaba entero aqui mientras pasaba en local, donde
  # se usa Node 22. Fijarlo a 22 hace que el entorno de compilacion y el de
  # desarrollo sean el mismo, que es lo que evita esta clase de sorpresa.
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Cabeceras de seguridad, para todo el sitio.
#
# Nota sobre la Content-Security-Policy: NO esta aqui, y es a proposito.
#
# Durante mucho tiempo no hubo CSP porque la web cargaba scripts y estilos de
# medio internet —fonts de Google, jsdelivr para Remixicon, Litepicker y
# moment— y una politica que permitiera todo eso no protegia de nada. Eso ya no
# es asi: fuentes, iconos y Litepicker estan autoalojados y moment desaparecio.
# Solo quedan dos origenes externos, googletagmanager y formspree.
#
# La CSP se genera en cada build y se escribe en public/_headers, que Netlify
# fusiona con este fichero. Vive alli y no aqui porque incluye los hashes
# SHA-256 de los dos scripts inline, y eso hay que calcularlo del HTML ya
# construido; un TOML estatico no puede. El codigo esta en .eleventy.js.
#
# Las cabeceras de abajo se quedan aqui, que sigue siendo su fuente unica.
# X-Frame-Options se mantiene pese a que la CSP trae frame-ancestors: los
# navegadores antiguos no leen frame-ancestors y si leen X-Frame-Options.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# Cache headers for static assets
[[headers]]
  for = "/dist/output.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    Access-Control-Allow-Origin = "*"

# HTML files - shorter cache for content updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Root and sitemap
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"
    Access-Control-Allow-Origin = "*"
